<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفع جودة الصور إلى 4K</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #4f7cff;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 28px; text-align: center; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s;
  }
  .drop:hover { border-color: var(--accent); }
  .drop input { display: none; }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { margin-top: 14px; color: var(--muted); font-size: 14px; text-align: center; min-height: 20px; }
  .result { margin-top: 20px; }
  .result img { width: 100%; border-radius: 10px; border: 1px solid var(--border); }
  a.download {
    display: block;
    text-align: center;
    margin-top: 12px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  select {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  label.small { font-size: 13px; color: var(--muted); display: block; margin-top: 16px; margin-bottom: 4px; }
</style>
</head>
<body>
  <h1>رفع جودة الصور بالذكاء الاصطناعي</h1>
  <p class="sub">ارفع صورة واحصل عليها بدقة أعلى وتفاصيل أوضح</p>

  <div class="card">
    <div class="drop" id="drop">
      <input type="file" id="fileInput" accept="image/*">
      <div id="dropText">اضغط هنا لاختيار صورة</div>
    </div>

    <label class="small">مستوى التكبير</label>
    <select id="scale">
      <option value="2">×2</option>
      <option value="4" selected>×4</option>
    </select>

    <button id="submitBtn" disabled>رفع الجودة الآن</button>
    <div class="status" id="status"></div>

    <div class="result" id="result" style="display:none">
      <img id="resultImg" alt="النتيجة">
      <a class="download" id="downloadLink" download="upscaled.png">⬇ تحميل الصورة</a>
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const dropText = document.getElementById('dropText');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const resultImg = document.getElementById('resultImg');
const downloadLink = document.getElementById('downloadLink');
const scaleSelect = document.getElementById('scale');

let selectedFile = null;

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) {
    selectedFile = fileInput.files[0];
    dropText.textContent = selectedFile.name;
    submitBtn.disabled = false;
  }
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

submitBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  submitBtn.disabled = true;
  resultEl.style.display = 'none';
  statusEl.textContent = 'جاري الرفع والمعالجة... قد يستغرق هذا دقيقة';

  try {
    const base64 = await fileToBase64(selectedFile);
    const res = await fetch('/api/upscale', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64, scale: scaleSelect.value })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'حدث خطأ غير متوقع');

    resultImg.src = data.outputUrl;
    downloadLink.href = data.outputUrl;
    resultEl.style.display = 'block';
    statusEl.textContent = 'تم بنجاح ✔';
  } catch (err) {
    statusEl.textContent = 'خطأ: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
